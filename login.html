<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickBook | Login</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="brand">Quick<span>Book</span></div><small>Movie tickets made simple</small></header><main class="auth-wrap"><section class="card"><h1>Welcome back</h1><p class="muted">Log in to book tickets or manage your hall.</p><form id="loginForm"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><button class="btn full" type="submit">Log in</button></form><div id="message" class="message"></div><p class="muted" style="text-align:center;margin:20px 0 0">New to QuickBook? <a class="link" href="signup.html">Create an account</a></p></section></main><script>
const msg=document.getElementById('message');document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();msg.className='message';msg.textContent='Logging in…';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.message);location.href=d.redirect}catch(err){msg.className='message error';msg.textContent=err.message||'Could not connect to server.'}});
</script></body></html>
