<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickBook | Sign up</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="brand">Quick<span>Book</span></div><small>Create your account</small></header><main class="auth-wrap"><section class="card"><h1>Create account</h1><p class="muted">Choose how you want to use QuickBook.</p><form id="signupForm"><label>Account type</label><div class="role-choice"><label><input type="radio" name="role" value="customer" checked> Customer</label><label><input type="radio" name="role" value="admin"> Hall manager</label></div><label for="name">Full name</label><input id="name" required autocomplete="name"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email"><label for="password">Password (at least 6 characters)</label><input id="password" type="password" minlength="6" required autocomplete="new-password"><div id="hallFields" class="hidden"><label for="hall_name">Hall / cinema name</label><input id="hall_name" placeholder="Example: City Cinema"><label for="city">City</label><input id="city" placeholder="Example: Dehradun"></div><button class="btn full" type="submit">Create account</button></form><div id="message" class="message"></div><p class="muted" style="text-align:center;margin:20px 0 0">Already registered? <a class="link" href="login.html">Log in</a></p></section></main><script>
const form=document.getElementById('signupForm'),msg=document.getElementById('message'),hallFields=document.getElementById('hallFields');form.querySelectorAll('input[name="role"]').forEach(r=>r.addEventListener('change',()=>hallFields.classList.toggle('hidden',form.querySelector('input[name="role"]:checked').value!=='admin')));form.addEventListener('submit',async e=>{e.preventDefault();msg.className='message';msg.textContent='Creating account…';const role=form.querySelector('input[name="role"]:checked').value;try{const r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,password:document.getElementById('password').value,role,hall_name:document.getElementById('hall_name').value,city:document.getElementById('city').value})});const d=await r.json();if(!r.ok)throw Error(d.message);msg.className='message ok';msg.textContent=d.message;setTimeout(()=>location.href='login.html',900)}catch(err){msg.className='message error';msg.textContent=err.message||'Could not connect to server.'}});
</script></body></html>
