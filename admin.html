<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickBook | Hall Manager</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div><div class="brand">Quick<span>Book</span></div><small id="hallLabel">Hall manager dashboard</small></div><div><span id="userName"></span> <button class="btn secondary" onclick="logout()">Log out</button></div></header><main class="wrap"><section class="card"><h1>Add a movie show</h1><p class="muted">Add the movie details below. Customers will see your show as soon as it is saved.</p><form id="showForm"><div class="grid"><div><label for="movie_name">Movie name</label><input id="movie_name" required placeholder="Example: Interstellar"></div><div><label for="ticket_price">Ticket price (₹)</label><input id="ticket_price" type="number" min="1" step="0.01" required placeholder="200"></div><div><label for="show_date">Show date</label><input id="show_date" type="date" required></div><div><label for="show_time">Show time</label><input id="show_time" type="time" required></div></div><button class="btn" type="submit" style="margin-top:16px">Add show</button></form><div id="message" class="message"></div></section><section class="card"><h2>Your movie shows</h2><div id="showList" class="muted">Loading shows…</div></section></main><script>
const $=id=>document.getElementById(id);async function api(url,opts={}){const r=await fetch(url,opts);const d=await r.json();if(!r.ok)throw Error(d.message||'Something went wrong');return d}async function logout(){await fetch('/api/logout',{method:'POST'});location.href='login.html'}function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}async function load(){try{const u=await api('/api/me');$('userName').textContent=u.name;$('hallLabel').textContent=(u.hall_name||'Your hall')+' · '+(u.city||'');const shows=await api('/api/admin/shows');if(!shows.length){$('showList').innerHTML='<div class="empty">No shows yet. Add your first movie above.</div>';return}$('showList').innerHTML=shows.map(s=>`<article class="show"><div class="show-head"><div><h3>${esc(s.movie_name)}</h3><div class="muted">${fmtDate(s.show_date)} · ${s.show_time}</div><div class="price">₹${Number(s.ticket_price).toFixed(2)} per seat</div></div><button class="btn danger" onclick="deleteShow(${s.id})">Delete</button></div></article>`).join('')}catch(e){if(e.message.includes('log in')||e.message.includes('permission'))location.href='login.html';else $('showList').textContent=e.message}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} $('showForm').addEventListener('submit',async e=>{e.preventDefault();$('message').className='message';try{const d=await api('/api/admin/shows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({movie_name:$('movie_name').value,show_date:$('show_date').value,show_time:$('show_time').value,ticket_price:$('ticket_price').value})});$('message').className='message ok';$('message').textContent=d.message;$('showForm').reset();load()}catch(err){$('message').className='message error';$('message').textContent=err.message}});async function deleteShow(id){if(!confirm('Delete this show?'))return;try{await api('/api/admin/shows/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}$('show_date').min=new Date().toISOString().slice(0,10);load();
</script></body></html>
